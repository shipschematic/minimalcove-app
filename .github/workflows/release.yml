name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: web
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build Android
        if: matrix.target == 'android'
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          flutter build linux --release
          cd build/linux/x64/release
          tar czf "$GITHUB_WORKSPACE/MinimalCove-linux-x64.tar.gz" --transform 's,^bundle,MinimalCove,' bundle

      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'MinimalCove-windows-x64.zip'

      - name: Build macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Package macOS
        if: matrix.target == 'macos'
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/Minimal Cove.app" "MinimalCove-macos-universal.zip"

      - name: Build iOS (unsigned)
        if: matrix.target == 'macos'
        run: flutter build ios --release --no-codesign

      - name: Package iOS
        if: matrix.target == 'macos'
        run: ditto -c -k --keepParent "build/ios/iphoneos/Runner.app" "MinimalCove-ios-unsigned.zip"

      - name: Build web
        if: matrix.target == 'web'
        run: flutter build web --release

      - name: Package web
        if: matrix.target == 'web'
        run: cd build && zip -qr "$GITHUB_WORKSPACE/MinimalCove-web.zip" web

      - name: Upload Android artifacts
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: MinimalCove-linux-x64.tar.gz
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: MinimalCove-windows-x64.zip
          if-no-files-found: error

      - name: Upload macOS and iOS artifacts
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            MinimalCove-macos-universal.zip
            MinimalCove-ios-unsigned.zip
          if-no-files-found: error

      - name: Upload web artifacts
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: MinimalCove-web.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
